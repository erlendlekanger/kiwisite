<!doctype html><html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1024px; height: 1024px; overflow: hidden; }
.s { position: relative; width: 1024px; height: 1024px; overflow: hidden; display: grid; place-items: center; perspective: 2200px; }
.card { position: absolute; width: 760px; aspect-ratio: 3370 / 2125; transform-style: preserve-3d; }
.card img { width: 100%; height: 100%; display: block; border-radius: 4.2% / 6.6%; }
.sheen { position: absolute; inset: 0; border-radius: 4.2% / 6.6%; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,0) 36%, rgba(255,255,255,.16) 47%, rgba(255,255,255,0) 58%); }
.grain::after { content: ""; position: absolute; inset: 0; opacity: .05; mix-blend-mode: multiply; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* 1 warm beige, flat and centred */
.v1 { background: radial-gradient(70% 60% at 50% 42%, #f3ede3, #e4dccd); }
.v1 .card { box-shadow: 0 40px 70px rgba(70,55,35,.28), 0 10px 22px rgba(70,55,35,.18); border-radius: 4.2% / 6.6%; }

/* 2 off-white, tilted in 3D with a long soft shadow */
.v2 { background: linear-gradient(160deg, #f7f6f2, #e9e7e1); }
.v2 .card { width: 800px; transform: rotateX(28deg) rotateZ(-14deg) translateY(-20px); }
.v2 .card img { box-shadow: 0 70px 90px rgba(40,40,40,.30), 0 20px 30px rgba(40,40,40,.18); }

/* 3 light studio grey, floating with a floor shadow */
.v3 { background: radial-gradient(80% 70% at 50% 30%, #fbfbfb, #dcdde0); }
.v3 .card { width: 780px; transform: rotateY(-22deg) rotateX(10deg) rotateZ(4deg) translateY(-50px); }
.v3 .card img { box-shadow: 0 30px 50px rgba(0,0,0,.25); }
.v3 .floor { position: absolute; width: 640px; height: 70px; left: 192px; top: 760px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0,0,0,.30), rgba(0,0,0,0)); filter: blur(8px); }

/* 6 beige, floating with a floor shadow (variant 3 on beige) */
.v6 { background: radial-gradient(80% 70% at 50% 30%, #f6f0e6, #e2d7c4); }
.v6 .card { width: 780px; transform: rotateY(-22deg) rotateX(10deg) rotateZ(4deg) translateY(-50px); }
.v6 .card img { box-shadow: 0 30px 50px rgba(70,55,35,.28); }
.v6 .floor { position: absolute; width: 640px; height: 70px; left: 192px; top: 760px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(80,60,35,.32), rgba(80,60,35,0)); filter: blur(8px); }

/* 4 beige, front and back fanned */
.v4 { background: radial-gradient(70% 60% at 50% 45%, #efe7da, #ddd2bf); }
.v4 .back { width: 720px; transform: rotateZ(-16deg) translate(-40px, -40px); }
.v4 .front { width: 720px; transform: rotateZ(8deg) translate(30px, 50px); }
.v4 .card img { box-shadow: 0 40px 70px rgba(70,55,35,.30), 0 8px 18px rgba(70,55,35,.2); }

/* 5 white, card upright so it fills the square, reads at icon size */
.v5 { background: radial-gradient(75% 70% at 50% 40%, #ffffff, #ececec); }
.v5 .card { width: 820px; transform: rotateZ(90deg); }
.v5 .card img { box-shadow: 0 0 0 1px rgba(0,0,0,.04), 40px 0 70px rgba(0,0,0,.22), 10px 0 20px rgba(0,0,0,.14); }
</style></head><body>
<div class="s grain" id="v"></div>
<script>
const n = new URLSearchParams(location.search).get('v') || '1';
const s = document.getElementById('v'); s.classList.add('v' + n);
const card = (src, cls = '') => `<div class="card ${cls}"><img src="${src}"><div class="sheen"></div></div>`;
s.innerHTML = n === '6' ? '<div class="floor"></div>' + card('card_front_io.png')
            : n === '3' ? '<div class="floor"></div>' + card('card_front.png')
            : n === '4' ? card('card_back.png', 'back') + card('card_front.png', 'front')
            : card('card_front.png');
</script></body></html>
