<!doctype html><html><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1600px; height: 900px; overflow: hidden; background: #060607; }
.s { position: relative; width: 1600px; height: 900px; overflow: hidden; perspective: 2000px; }
.card { position: absolute; aspect-ratio: 3370 / 2125; transform-style: preserve-3d; }
.card img { width: 100%; height: 100%; display: block; border-radius: 4.2% / 6.6%; }
.sheen { position: absolute; inset: 0; border-radius: 4.2% / 6.6%;
  background: linear-gradient(115deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.2) 48%, rgba(255,255,255,0) 58%); }
.grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.streak { position: absolute; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.6)); }

/* A: both cards in flight */
.a { background: radial-gradient(700px 520px at 980px 450px, rgba(58,86,200,.45), rgba(58,86,200,0) 70%),
                 radial-gradient(600px 420px at 560px 520px, rgba(220,225,235,.10), rgba(220,225,235,0) 70%),
                 linear-gradient(180deg, #0b0b0e, #040405); }
.a .c1 { width: 640px; left: 760px; top: 150px; transform: rotateZ(-14deg) rotateY(-24deg) rotateX(14deg); }
.a .c2 { width: 600px; left: 300px; top: 330px; transform: rotateZ(11deg) rotateY(26deg) rotateX(-10deg); }
.a .card img { box-shadow: 0 60px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07); }

/* C: beige, the metal card floating */
.c { background: radial-gradient(900px 640px at 50% 32%, #f6f0e6, #e0d4c0); }
.c .c1 { width: 860px; left: 370px; top: 150px; transform: rotateY(-22deg) rotateX(10deg) rotateZ(4deg); }
.c .card img { box-shadow: 0 34px 56px rgba(70,55,35,.28); }
.c .floor { position: absolute; width: 700px; height: 70px; left: 450px; top: 760px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(80,60,35,.32), rgba(80,60,35,0)); filter: blur(8px); }
.c .grain { mix-blend-mode: multiply; opacity: .05; }

/* B: the metal card up close, raking light */
.b { background: radial-gradient(900px 600px at 70% 30%, #26262b, #0a0a0c 60%, #050506); }
.b .light { position: absolute; width: 1400px; height: 380px; left: 200px; top: 160px; transform: rotate(-24deg);
  background: radial-gradient(closest-side, rgba(255,255,255,.10), rgba(255,255,255,0)); filter: blur(20px); }
.b .c1 { width: 1250px; left: 210px; top: 140px; transform: rotateX(48deg) rotateZ(-22deg) translateZ(40px); }
.b .card img { box-shadow: 0 90px 120px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.06); }
.b .sheen { background: linear-gradient(105deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.28) 44%, rgba(255,255,255,0) 54%); }
</style></head><body>
<div class="s" id="s"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'a';
const s = document.getElementById('s'); s.classList.add(v);
const card = (src, cls) => `<div class="card ${cls}"><img src="${src}"><div class="sheen"></div></div>`;
const st = (l, t, w, o, r) => `<div class="streak" style="left:${l}px;top:${t}px;width:${w}px;opacity:${o};transform:rotate(${r}deg)"></div>`;
s.innerHTML = v === 'c' ? '<div class="floor"></div>' + card('card_front_io.png', 'c1') + '<div class="grain"></div>'
  : v === 'a'
  ? st(560,250,260,.9,-14) + st(610,320,170,.5,-14) + st(640,470,200,.4,-14) + st(80,560,240,.5,11) + st(120,640,160,.35,11)
    + card('card_front_io.png', 'c2') + card('card_virtual.png', 'c1') + '<div class="grain"></div>'
  : '<div class="light"></div>' + card('card_front_io.png', 'c1') + '<div class="grain"></div>';
</script></body></html>
