<!doctype html>
<html><head><meta charset="utf-8"><title>earth render</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head><body><canvas id="c" width="4096" height="4096"></canvas>
<script type="module">
// The FOMOcard earth (same shader as PACKHUNT), rendered once on a transparent background. Serve packhunt/web and open
// tools_earth_render.html?size=6144&sx=-0.5&sy=-0.35&sz=0.8&rot=0.95&tilt=-0.15 (textures live there); this is a copy for reference.
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const SIZE = +q.get('size') || 4096;
const canvas = document.getElementById('c'); canvas.width = canvas.height = SIZE;
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setClearColor(0x000000, 0); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.16;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(25, 1, 0.1, 100); cam.position.set(0, 0, 4.95);
const SUN = new THREE.Vector3(+q.get('sx') || 0.9, +q.get('sy') || 0.9, +q.get('sz') || 0.6).normalize();
const loader = new THREE.TextureLoader();
const tex = (u, srgb = true) => new Promise(res => loader.load(u, t => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = r.capabilities.getMaxAnisotropy(); res(t); }));
const [day, night, clouds] = await Promise.all([tex('/packhunt/web/assets/earth/day_8k.jpg'), tex('/packhunt/web/assets/earth/night_4k.jpg'), tex('/packhunt/web/assets/earth/clouds_4k.jpg', false)]);
const U = { uDay: { value: day }, uNight: { value: night }, uClouds: { value: clouds }, uSun: { value: SUN }, uDayAtmo: { value: new THREE.Color('#9fd2ff') }, uTwilight: { value: new THREE.Color('#3f72c2') }, uOpacity: { value: 1 } };
const vert = `varying vec2 vUv; varying vec3 vN; varying vec3 vP; void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.0); vP=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`;
const sphere = new THREE.SphereGeometry(1, 256, 256);
const globe = new THREE.Mesh(sphere, new THREE.ShaderMaterial({ uniforms: U, transparent: true, vertexShader: vert, fragmentShader: `
  uniform sampler2D uDay, uNight, uClouds; uniform vec3 uSun, uDayAtmo, uTwilight; uniform float uOpacity;
  varying vec2 vUv; varying vec3 vN; varying vec3 vP;
  void main(){
    vec3 n=normalize(vN); vec3 v=normalize(cameraPosition-vP); float sunO=dot(n,uSun);
    float cloud=smoothstep(0.1,0.85,texture2D(uClouds,vUv).r);
    vec3 day=mix(texture2D(uDay,vUv).rgb,vec3(1.0),clamp(cloud*2.0,0.0,1.0));
    float lit=max(sunO,0.0); vec3 h=normalize(uSun+v);
    float spec=pow(max(dot(n,h),0.0),60.0)*(1.0-cloud)*lit*0.5;
    vec3 dayCol=day*(0.04+1.25*lit)+spec*0.8;
    vec3 night=texture2D(uNight,vUv).rgb*1.6*(1.0-cloud*0.8);
    vec3 col=mix(night,dayCol,smoothstep(-0.25,0.5,sunO));
    // fomo.family's earth: a light steel-blue grade and a soft haze over the whole day side
    float lum=dot(col,vec3(0.3,0.5,0.2));
    col=mix(col,vec3(lum)*vec3(0.74,1.0,1.18)+vec3(0.05,0.10,0.14),0.8*smoothstep(-0.1,0.4,sunO));
    float fres=1.0-abs(dot(v,n));
    vec3 atmo=mix(uTwilight,uDayAtmo,smoothstep(-0.25,0.75,sunO));
    col=mix(col,atmo,clamp(smoothstep(-0.5,1.0,sunO)*(0.10+pow(fres,1.6)),0.0,1.0));
    gl_FragColor=vec4(col,uOpacity);
  }` }));
const atmo = new THREE.Mesh(sphere, new THREE.ShaderMaterial({ uniforms: U, side: THREE.BackSide, transparent: true, depthWrite: false, vertexShader: vert, fragmentShader: `
  uniform vec3 uSun, uDayAtmo, uTwilight; uniform float uOpacity; varying vec3 vN; varying vec3 vP;
  void main(){ vec3 n=normalize(vN); vec3 v=normalize(cameraPosition-vP); float fres=1.0-abs(dot(v,n)); float sunO=dot(n,uSun);
    float a=pow(clamp(1.0-(fres-0.70)/0.30,0.0,1.0),2.2)*smoothstep(-0.5,1.0,sunO)*1.15;
    vec3 atmoC=mix(uTwilight,uDayAtmo,smoothstep(-0.25,0.75,sunO)); gl_FragColor=vec4(atmoC,a*uOpacity); }` }));
atmo.scale.setScalar(1.05);
const g = new THREE.Group(); g.add(globe, atmo); g.rotation.y = +q.get('rot') || -Math.PI / 1.4; g.rotation.x = +q.get('tilt') || 0.25; scene.add(g);
r.render(scene, cam);
window.__done = true;
</script></body></html>
